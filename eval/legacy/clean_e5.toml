# Абляция D: очищенный текст + многоязычная модель эмбеддингов.
# Отличается от clean.toml ТОЛЬКО моделью эмбеддингов — это изолирует эффект
# модели в кросс-язычном сценарии (русскоязычные вопросы к англоязычному корпусу).
#
# Почему e5-small, а не bge-m3: bge-m3 в fastembed поставляется как fp32 ONNX
# (~2.2 ГБ, 568M параметров) и на CPU даёт ~0.04 чанка/с — это ~23 часа на корпус
# из 3418 чанков. multilingual-e5-small (118M, 384 измерения) решает ту же задачу
# о многоязычности за минуты. Замеренная пропускная способность bge-m3 приведена
# в статье как практическое ограничение.
store_path = "data/index_clean_e5.sqlite"
inputs = "dicts"
models_dir = "models"

[cleaning]
enabled = true

[embedding]
model = "multilingual-e5-small"
max_length = 512
intra_threads = 8
batch_size = 64

[chunking]
target_tokens = 900
overlap_tokens = 150
max_chunk_chars = 4000
min_chunk_chars = 0
