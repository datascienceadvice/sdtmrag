[package]
name = "sdtmrag"
version = "0.1.0"
edition = "2024"
description = "RAG по документации SDTM/CDISC: локальные эмбеддинги + реранк (fastembed) + DeepSeek"
license = "MIT"
readme = "README.md"
keywords = ["rag", "sdtm", "cdisc", "retrieval", "onnx"]
categories = ["science", "text-processing"]

[features]
default = []
server = ["dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pdf-extract = "0.12"
calamine = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
rayon = "1"
regex = "1"

axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace"] }

[profile.release]
lto = true
codegen-units = 1